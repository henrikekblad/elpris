name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spotnav-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_STORE_PATH: ${{ github.workspace }}/release.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASS }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$SIGNING_STORE_PATH"
      - run: ./gradlew assembleRelease
      - name: Name release APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/spotnav-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: spotnav-release
          path: app/build/outputs/apk/release/spotnav-*.apk
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" "app/build/outputs/apk/release/spotnav-${GITHUB_REF_NAME#v}.apk" --generate-notes --verify-tag
